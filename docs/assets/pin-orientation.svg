<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="910" viewBox="0 0 1280 910" role="img" aria-labelledby="title desc"><title id="title">Physical pins and BCM GPIO numbers</title><desc id="desc">40 physical positions, the first 26 used by Gertboard J1, and the GPIO17 example.</desc><g font-family="DejaVu Sans,Arial,sans-serif"><rect width="1280" height="910" rx="20" fill="#f3f7fa"/><text x="38" y="52" font-size="31" fill="#20364a" font-weight="700" text-anchor="start">One header. Two numbering systems.</text><text x="38" y="84" font-size="18" fill="#536b7d" font-weight="400" text-anchor="start">Physical connector positions are different from BCM GPIO numbers.</text><rect x="28" y="112" width="750" height="714" rx="16" fill="#ffffff" stroke="#d9e4eb"/><rect x="285" y="143" width="230" height="596" rx="15" fill="#142d3e"/><rect x="34" y="142" width="738" height="385" rx="10" fill="#dff3f0" fill-opacity=".45"/><rect x="285" y="143" width="230" height="596" rx="15" fill="#142d3e"/><circle cx="349" cy="164" r="7" fill="#d99413"/><circle cx="349" cy="164" r="13" fill="none" stroke="#facc15" stroke-width="4"/><text x="314" y="169" font-size="14" fill="#facc15" font-weight="700" text-anchor="middle">1</text><text x="258" y="170" font-size="17" fill="#20364a" font-weight="600" text-anchor="end">3V3</text><circle cx="451" cy="164" r="7" fill="#d64668"/><text x="486" y="169" font-size="14" fill="#e5eef5" font-weight="700" text-anchor="middle">2</text><text x="542" y="170" font-size="17" fill="#20364a" font-weight="600" text-anchor="start">5V</text><circle cx="349" cy="193" r="7" fill="#16a17a"/><text x="314" y="198" font-size="14" fill="#e5eef5" font-weight="700" text-anchor="middle">3</text><text x="258" y="199" font-size="17" fill="#20364a" font-weight="600" text-anchor="end">GPIO2</text><circle cx="451" cy="193" r="7" fill="#d64668"/><text x="486" y="198" font-size="14" fill="#e5eef5" font-weight="700" text-anchor="middle">4</text><text x="542" y="199" font-size="17" fill="#20364a" font-weight="600" text-anchor="start">5V</text><circle cx="349" cy="222" r="7" fill="#16a17a"/><text x="314" y="227" font-size="14" fill="#e5eef5" font-weight="700" text-anchor="middle">5</text><text x="258" y="228" font-size="17" fill="#20364a" font-weight="600" text-anchor="end">GPIO3</text><circle cx="451" cy="222" r="7" fill="#8394a3"/><text x="486" y="227" font-size="14" fill="#e5eef5" font-weight="700" text-anchor="middle">6</text><text x="542" y="228" font-size="17" fill="#20364a" font-weight="600" text-anchor="start">GND</text><circle cx="349" cy="251" r="7" fill="#16a17a"/><text x="314" y="256" font-size="14" fill="#e5eef5" font-weight="700" text-anchor="middle">7</text><text x="258" y="257" font-size="17" fill="#20364a" font-weight="600" text-anchor="end">GPIO4</text><circle cx="451" cy="251" r="7" fill="#16a17a"/><text x="486" y="256" font-size="14" fill="#e5eef5" font-weight="700" text-anchor="middle">8</text><text x="542" y="257" font-size="17" fill="#20364a" font-weight="600" text-anchor="start">GPIO14</text><circle cx="349" cy="280" r="7" fill="#8394a3"/><text x="314" y="285" font-size="14" fill="#e5eef5" font-weight="700" text-anchor="middle">9</text><text x="258" y="286" font-size="17" fill="#20364a" font-weight="600" text-anchor="end">GND</text><circle cx="451" cy="280" r="7" fill="#16a17a"/><text x="486" y="285" font-size="14" fill="#e5eef5" font-weight="700" text-anchor="middle">10</text><text x="542" y="286" font-size="17" fill="#20364a" font-weight="600" text-anchor="start">GPIO15</text><circle cx="349" cy="309" r="7" fill="#16a17a"/><text x="314" y="314" font-size="14" fill="#e5eef5" font-weight="700" text-anchor="middle">11</text><text x="258" y="315" font-size="17" fill="#20364a" font-weight="600" text-anchor="end">GPIO17</text><circle cx="451" cy="309" r="7" fill="#16a17a"/><text x="486" y="314" font-size="14" fill="#e5eef5" font-weight="700" text-anchor="middle">12</text><text x="542" y="315" font-size="17" fill="#20364a" font-weight="600" text-anchor="start">GPIO18</text><circle cx="349" cy="338" r="7" fill="#16a17a"/><text x="314" y="343" font-size="14" fill="#e5eef5" font-weight="700" text-anchor="middle">13</text><text x="258" y="344" font-size="17" fill="#20364a" font-weight="600" text-anchor="end">GPIO27</text><circle cx="451" cy="338" r="7" fill="#8394a3"/><text x="486" y="343" font-size="14" fill="#e5eef5" font-weight="700" text-anchor="middle">14</text><text x="542" y="344" font-size="17" fill="#20364a" font-weight="600" text-anchor="start">GND</text><circle cx="349" cy="367" r="7" fill="#16a17a"/><text x="314" y="372" font-size="14" fill="#e5eef5" font-weight="700" text-anchor="middle">15</text><text x="258" y="373" font-size="17" fill="#20364a" font-weight="600" text-anchor="end">GPIO22</text><circle cx="451" cy="367" r="7" fill="#16a17a"/><text x="486" y="372" font-size="14" fill="#e5eef5" font-weight="700" text-anchor="middle">16</text><text x="542" y="373" font-size="17" fill="#20364a" font-weight="600" text-anchor="start">GPIO23</text><circle cx="349" cy="396" r="7" fill="#d99413"/><text x="314" y="401" font-size="14" fill="#e5eef5" font-weight="700" text-anchor="middle">17</text><text x="258" y="402" font-size="17" fill="#20364a" font-weight="600" text-anchor="end">3V3</text><circle cx="451" cy="396" r="7" fill="#16a17a"/><text x="486" y="401" font-size="14" fill="#e5eef5" font-weight="700" text-anchor="middle">18</text><text x="542" y="402" font-size="17" fill="#20364a" font-weight="600" text-anchor="start">GPIO24</text><circle cx="349" cy="425" r="7" fill="#16a17a"/><text x="314" y="430" font-size="14" fill="#e5eef5" font-weight="700" text-anchor="middle">19</text><text x="258" y="431" font-size="17" fill="#20364a" font-weight="600" text-anchor="end">GPIO10</text><circle cx="451" cy="425" r="7" fill="#8394a3"/><text x="486" y="430" font-size="14" fill="#e5eef5" font-weight="700" text-anchor="middle">20</text><text x="542" y="431" font-size="17" fill="#20364a" font-weight="600" text-anchor="start">GND</text><circle cx="349" cy="454" r="7" fill="#16a17a"/><text x="314" y="459" font-size="14" fill="#e5eef5" font-weight="700" text-anchor="middle">21</text><text x="258" y="460" font-size="17" fill="#20364a" font-weight="600" text-anchor="end">GPIO9</text><circle cx="451" cy="454" r="7" fill="#16a17a"/><text x="486" y="459" font-size="14" fill="#e5eef5" font-weight="700" text-anchor="middle">22</text><text x="542" y="460" font-size="17" fill="#20364a" font-weight="600" text-anchor="start">GPIO25</text><circle cx="349" cy="483" r="7" fill="#16a17a"/><text x="314" y="488" font-size="14" fill="#e5eef5" font-weight="700" text-anchor="middle">23</text><text x="258" y="489" font-size="17" fill="#20364a" font-weight="600" text-anchor="end">GPIO11</text><circle cx="451" cy="483" r="7" fill="#16a17a"/><text x="486" y="488" font-size="14" fill="#e5eef5" font-weight="700" text-anchor="middle">24</text><text x="542" y="489" font-size="17" fill="#20364a" font-weight="600" text-anchor="start">GPIO8</text><circle cx="349" cy="512" r="7" fill="#8394a3"/><text x="314" y="517" font-size="14" fill="#e5eef5" font-weight="700" text-anchor="middle">25</text><text x="258" y="518" font-size="17" fill="#20364a" font-weight="600" text-anchor="end">GND</text><circle cx="451" cy="512" r="7" fill="#16a17a"/><text x="486" y="517" font-size="14" fill="#e5eef5" font-weight="700" text-anchor="middle">26</text><text x="542" y="518" font-size="17" fill="#20364a" font-weight="600" text-anchor="start">GPIO7</text><circle cx="349" cy="541" r="7" fill="#9570dc"/><text x="314" y="546" font-size="14" fill="#e5eef5" font-weight="700" text-anchor="middle">27</text><text x="258" y="547" font-size="17" fill="#20364a" font-weight="600" text-anchor="end">GPIO0 / HAT ID</text><circle cx="451" cy="541" r="7" fill="#9570dc"/><text x="486" y="546" font-size="14" fill="#e5eef5" font-weight="700" text-anchor="middle">28</text><text x="542" y="547" font-size="17" fill="#20364a" font-weight="600" text-anchor="start">GPIO1 / HAT ID</text><circle cx="349" cy="570" r="7" fill="#16a17a"/><text x="314" y="575" font-size="14" fill="#e5eef5" font-weight="700" text-anchor="middle">29</text><text x="258" y="576" font-size="17" fill="#20364a" font-weight="600" text-anchor="end">GPIO5</text><circle cx="451" cy="570" r="7" fill="#8394a3"/><text x="486" y="575" font-size="14" fill="#e5eef5" font-weight="700" text-anchor="middle">30</text><text x="542" y="576" font-size="17" fill="#20364a" font-weight="600" text-anchor="start">GND</text><circle cx="349" cy="599" r="7" fill="#16a17a"/><text x="314" y="604" font-size="14" fill="#e5eef5" font-weight="700" text-anchor="middle">31</text><text x="258" y="605" font-size="17" fill="#20364a" font-weight="600" text-anchor="end">GPIO6</text><circle cx="451" cy="599" r="7" fill="#16a17a"/><text x="486" y="604" font-size="14" fill="#e5eef5" font-weight="700" text-anchor="middle">32</text><text x="542" y="605" font-size="17" fill="#20364a" font-weight="600" text-anchor="start">GPIO12</text><circle cx="349" cy="628" r="7" fill="#16a17a"/><text x="314" y="633" font-size="14" fill="#e5eef5" font-weight="700" text-anchor="middle">33</text><text x="258" y="634" font-size="17" fill="#20364a" font-weight="600" text-anchor="end">GPIO13</text><circle cx="451" cy="628" r="7" fill="#8394a3"/><text x="486" y="633" font-size="14" fill="#e5eef5" font-weight="700" text-anchor="middle">34</text><text x="542" y="634" font-size="17" fill="#20364a" font-weight="600" text-anchor="start">GND</text><circle cx="349" cy="657" r="7" fill="#16a17a"/><text x="314" y="662" font-size="14" fill="#e5eef5" font-weight="700" text-anchor="middle">35</text><text x="258" y="663" font-size="17" fill="#20364a" font-weight="600" text-anchor="end">GPIO19</text><circle cx="451" cy="657" r="7" fill="#16a17a"/><text x="486" y="662" font-size="14" fill="#e5eef5" font-weight="700" text-anchor="middle">36</text><text x="542" y="663" font-size="17" fill="#20364a" font-weight="600" text-anchor="start">GPIO16</text><circle cx="349" cy="686" r="7" fill="#16a17a"/><text x="314" y="691" font-size="14" fill="#e5eef5" font-weight="700" text-anchor="middle">37</text><text x="258" y="692" font-size="17" fill="#20364a" font-weight="600" text-anchor="end">GPIO26</text><circle cx="451" cy="686" r="7" fill="#16a17a"/><text x="486" y="691" font-size="14" fill="#e5eef5" font-weight="700" text-anchor="middle">38</text><text x="542" y="692" font-size="17" fill="#20364a" font-weight="600" text-anchor="start">GPIO20</text><circle cx="349" cy="715" r="7" fill="#8394a3"/><text x="314" y="720" font-size="14" fill="#e5eef5" font-weight="700" text-anchor="middle">39</text><text x="258" y="721" font-size="17" fill="#20364a" font-weight="600" text-anchor="end">GND</text><circle cx="451" cy="715" r="7" fill="#16a17a"/><text x="486" y="720" font-size="14" fill="#e5eef5" font-weight="700" text-anchor="middle">40</text><text x="542" y="721" font-size="17" fill="#20364a" font-weight="600" text-anchor="start">GPIO21</text><path d="M746 145 h13 v379 h-13" fill="none" stroke="#109482" stroke-width="3"/><text x="46" y="781" font-size="18" fill="#20364a" font-weight="700" text-anchor="start">Yellow ring = physical pin 1</text><text x="46" y="807" font-size="14" fill="#536b7d" font-weight="400" text-anchor="start">Static pinout reference — no live levels or voltage measurements.</text><rect x="802" y="112" width="448" height="714" rx="16" fill="#ffffff" stroke="#d9e4eb"/><text x="828" y="153" font-size="16" fill="#0b8a78" font-weight="700" text-anchor="start">GERTBOARD J1</text><text x="828" y="190" font-size="24" fill="#20364a" font-weight="700" text-anchor="start">26 contacts · 17 Pi signals</text><text x="828" y="222" font-size="17" fill="#20364a" font-weight="400" text-anchor="start">The shaded first 13 rows are J1.</text><text x="828" y="249" font-size="17" fill="#20364a" font-weight="400" text-anchor="start">Pi positions 27–40 are outside J1.</text><text x="828" y="306" font-size="20" fill="#20364a" font-weight="700" text-anchor="start">A concrete example</text><rect x="826" y="319" width="397" height="55" rx="9" fill="#e9f4f3"/><text x="844" y="343" font-size="18" fill="#20364a" font-weight="700" text-anchor="start">Physical pin 11</text><text x="844" y="364" font-size="13" fill="#536b7d" font-weight="400" text-anchor="start">Position on the connector</text><rect x="826" y="387" width="397" height="55" rx="9" fill="#e9f4f3"/><text x="844" y="411" font-size="18" fill="#20364a" font-weight="700" text-anchor="start">BCM GPIO17</text><text x="844" y="432" font-size="13" fill="#536b7d" font-weight="400" text-anchor="start">Number used by the app</text><rect x="826" y="455" width="397" height="55" rx="9" fill="#e9f4f3"/><text x="844" y="479" font-size="18" fill="#20364a" font-weight="700" text-anchor="start">J2 · GP17</text><text x="844" y="500" font-size="13" fill="#536b7d" font-weight="400" text-anchor="start">Legacy Gertboard signal label</text><text x="828" y="553" font-size="17" fill="#20364a" font-weight="700" text-anchor="start">B1 is buffer channel 1, not GPIO1.</text><text x="828" y="583" font-size="16" fill="#20364a" font-weight="400" text-anchor="start">A patch wire assigns GP17 to B1.</text><text x="828" y="640" font-size="18" fill="#20364a" font-weight="700" text-anchor="start">Legacy board labels on Pi 5</text><text x="828" y="674" font-size="16" fill="#20364a" font-weight="400" text-anchor="start">GP0 → GPIO2</text><text x="1030" y="674" font-size="16" fill="#20364a" font-weight="400" text-anchor="start">GP1 → GPIO3</text><text x="828" y="705" font-size="16" fill="#20364a" font-weight="400" text-anchor="start">GP21 → GPIO27</text><text x="828" y="761" font-size="17" fill="#20364a" font-weight="700" text-anchor="start">J1 names the connector.</text><text x="828" y="787" font-size="16" fill="#20364a" font-weight="400" text-anchor="start">Use the pin-1 mark to orient it.</text><text x="38" y="869" font-size="17" fill="#536b7d" font-weight="400" text-anchor="start">Top view of the header · match physical pin 1 before connecting · disconnect all power before rewiring</text></g></svg>
